
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleurs Élégance | Gestion des commandes</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="./css/style.css">

    <style>
        :root {
            --pink: #c65379;
            --pink-dark: #913653;
            --pink-light: #fff0f5;
        }

        body {
            background: #fffaf7;
        }

        .top-header {
            background: #f8dce7 !important;
            border-bottom: 1px solid #edbfd0;
            padding: 22px 0;
        }

        .top-header h1 {
            color: #913653 !important;
            margin: 0;
            font-size: clamp(1.5rem, 4vw, 2.3rem);
            font-weight: 800;
        }

        .top-header p {
            color: #754354 !important;
            margin: 6px 0 0;
        }

        .section-heading {
            color: #913653;
            font-weight: 750;
        }

        .btn-primary {
            background-color: #c65379 !important;
            border-color: #c65379 !important;
        }

        .btn-primary:hover {
            background-color: #913653 !important;
            border-color: #913653 !important;
        }

        #error-message:not(.d-none) {
            display: block;
        }
    </style>
</head>

<body>
    <header class="top-header">
        <div class="container">
            <h1>🌸 Fleurs Élégance</h1>
            <p>La beauté des fleurs, le plaisir d'offrir.</p>
        </div>
    </header>

    <main class="container py-4">
        <section class="mb-4">
            <h2 class="section-heading">Tableau de bord</h2>
            <p class="text-muted">
                Gérez vos clients, vos produits et vos commandes.
            </p>
        </section>

        <div id="error-message" class="alert alert-danger d-none" role="alert"></div>

        <section class="row g-3 mb-5" id="indicators"></section>

        <section class="card p-3 p-md-4 mb-5">
            <h2 class="section-heading mb-3">Recherche et filtres</h2>

            <div class="row g-3">
                <div class="col-12 col-md-4">
                    <label for="search" class="form-label">
                        Rechercher un client
                    </label>
                    <input
                        type="search"
                        id="search"
                        class="form-control"
                        placeholder="Ex. Nadia"
                    >
                </div>

                <div class="col-12 col-md-4">
                    <label for="status-filter" class="form-label">
                        Statut de la commande
                    </label>
                    <select id="status-filter" class="form-select">
                        <option value="">Tous les statuts</option>
                        <option value="Livree">Livrée</option>
                        <option value="En attente">En attente</option>
                        <option value="Annulee">Annulée</option>
                    </select>
                </div>

                <div class="col-12 col-md-4">
                    <label for="category-filter" class="form-label">
                        Catégorie de fleurs
                    </label>
                    <select id="category-filter" class="form-select">
                        <option value="">Toutes les catégories</option>
                    </select>
                </div>
            </div>
        </section>

        <section class="mb-5">
            <h2 class="section-heading mb-4">🌷 Nos commandes</h2>
            <div id="orders-container"></div>
            <div id="order-detail" class="mt-4"></div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p class="mb-1 fw-bold">🌸 Fleurs Élégance</p>
            <p class="mb-0">Des fleurs pour chaque émotion.</p>
        </div>
    </footer>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
